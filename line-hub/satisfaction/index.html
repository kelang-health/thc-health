<style>:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#17342d;background:#f4faf7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf9f3,#f5f8ff,#fffaf2);min-height:100vh}main{width:min(760px,calc(100% - 20px));margin:12px auto;background:#fff;border:1px solid #dce8e3;border-radius:22px;padding:18px;box-shadow:0 10px 30px #143c3210}.brand{display:flex;gap:12px;align-items:center}.brand img{width:58px;height:58px;object-fit:contain}.brand h1{margin:0;font-size:24px}.muted{color:#5f746e;font-size:13px}.q{border:0;padding:0;margin:16px 0}.q legend{font-weight:700;line-height:1.4}.opts{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px}.opts label{position:relative}.opts input{position:absolute;opacity:0}.opts span{display:grid;place-items:center;min-height:44px;border:1px solid #b4d0be;border-radius:10px;background:#eef8f3}.opts input:checked+span{background:#0b684f;color:#fff}select,button{width:100%;font:inherit;padding:12px;border-radius:12px}select{border:1px solid #b9d4c6;background:#fff}button{border:0;background:#0b684f;color:#fff;font-weight:700;margin-top:12px}.consent{display:flex;gap:8px;align-items:flex-start;font-size:13px}.consent input{width:20px;height:20px}.msg{white-space:pre-wrap;margin-top:12px;color:#a32b23}.ok{background:#e7f4ed;border-radius:16px;padding:20px;text-align:center}.credit{text-align:center;color:#71847c;font-size:11px;margin-top:18px}@media(max-width:560px){.opts{grid-template-columns:repeat(3,1fr)}.brand h1{font-size:20px}}</style></head>
<body><main><header class="brand"><img src="https://kelang-health.github.io/med-device-sharing/assets/logo.png?v=4.2.4" alt=""><div><h1>ประเมินบริการ · 5 ข้อ</h1><div class="muted">ศูนย์บริการสาธารณสุขบ้านโทกหัวช้าง · เทศบาลเมืองเขลางค์นคร</div></div></header><p class="muted">กรุณาประเมินจากการรับบริการครั้งล่าสุดของท่าน · ไม่เก็บชื่อ เลขบัตร เบอร์โทร LINE ID หรือข้อมูลโรค</p><form id="f"><select id="exp" required><option value="">คุณรับบริการอย่างไร</option><option value="self">รับบริการด้วยตนเอง</option><option value="companion">มาร่วมกับผู้รับบริการ</option></select><div id="qs"></div><label class="consent"><input id="c" type="checkbox" required><span>ยินยอมให้เก็บผลประเมินแบบไม่ระบุตัวบุคคล เพื่อปรับปรุงคุณภาพบริการ</span></label><button id="b">ส่งผลประเมิน</button><div id="m" class="msg"></div></form><div class="credit">© 2026 LINE Service Hub Design &amp; Developed by Apiwat Meethong</div></main>
<script>const API='https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/linehub-public-satisfaction',items=[[1,'เจ้าหน้าที่ให้บริการด้วยความสุภาพเป็นมิตร'],[4,'เจ้าหน้าที่ให้คำแนะนำและตอบข้อซักถามได้เป็นอย่างดี'],[17,'สภาพแวดล้อมของศูนย์สะอาด เป็นระเบียบ และเหมาะสมต่อการรับบริการ'],[18,'สิ่งอำนวยความสะดวกโดยรวมเพียงพอและสะดวกต่อการใช้งาน'],[16,'ความพึงพอใจโดยรวมที่ได้รับ']],q=document.getElementById('qs'),f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');for(const [id,t] of items){const x=document.createElement('fieldset');x.className='q';x.innerHTML='<legend>'+t+'</legend><div class="opts">'+['1','2','3','4','5','na'].map(v=>'<label><input required type="radio" name="q'+id+'" value="'+v+'"><span>'+(v==='na'?'—':v)+'</span></label>').join('')+'</div>';q.append(x)}f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='กำลังบันทึก…';const answers={};for(const [id] of items){const v=document.querySelector('input[name=q'+id+']:checked')?.value;if(!v){b.disabled=false;return}answers[String(id)]=v==='na'?'na':Number(v)}if(Object.values(answers).every(v=>v==='na')){m.textContent='กรุณาให้คะแนนอย่างน้อยหนึ่งข้อ';b.disabled=false;return}const body={response_id:crypto.randomUUID(),experience:document.getElementById('exp').value,consent:true,instrument_version:'thc-onsite-2569-short5-v1',answers};try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.detail||'บันทึกไม่ได้');f.innerHTML='<div class="ok"><h2>ประเมินเรียบร้อยแล้ว</h2><p>ขอบคุณสำหรับความคิดเห็นของท่าน</p><small>เลขอ้างอิง: '+j.reference+'</small></div>'}catch(err){m.textContent=err.message;b.disabled=false}}</script></body></html>
