<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b684f"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://txjuiaiwffsxfcrxpkvd.supabase.co; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"><title>ยืมอุปกรณ์การแพทย์</title>
<style>:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#17342d;background:#f4faf7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf9f3,#f5f8ff,#fffaf2);min-height:100vh}main{width:min(720px,calc(100% - 20px));margin:12px auto;background:#fff;border:1px solid #dce8e3;border-radius:22px;padding:18px;box-shadow:0 10px 30px #143c3210}h1{margin:0 0 4px;font-size:24px}.muted{color:#5f746e;font-size:13px;line-height:1.5}label{display:block;font-weight:700;margin:14px 0 6px}select,input,textarea,button{width:100%;font:inherit;padding:12px;border-radius:12px}select,input,textarea{border:1px solid #b9d4c6;background:#fff}textarea{min-height:86px}button{border:0;background:#0b684f;color:#fff;font-weight:700;margin-top:14px}.note{background:#eef8f3;border-radius:12px;padding:12px;margin-top:12px}.ok{background:#e7f4ed;border-radius:16px;padding:20px;text-align:center}.line{display:block;text-align:center;background:#06c755;color:#fff;text-decoration:none;padding:12px;border-radius:12px;margin-top:12px}.msg{white-space:pre-wrap;margin-top:12px;color:#a32b23}.credit{text-align:center;color:#71847c;font-size:11px;margin-top:18px}</style></head>
<body><main><h1>ยืมอุปกรณ์การแพทย์</h1><div class="muted">ศูนย์บริการสาธารณสุขบ้านโทกหัวช้าง · ส่งคำขอได้ตลอด 24 ชั่วโมง เจ้าหน้าที่ตรวจสอบก่อนอนุมัติ</div><form id="f"><label>ประเภทอุปกรณ์</label><select id="t" required><option value="">กรุณาเลือก</option><option value="wheelchair">รถเข็นผู้ป่วย</option><option value="walker">อุปกรณ์ช่วยเดิน</option><option value="hospital_bed">เตียงผู้ป่วย</option><option value="oxygen">อุปกรณ์ออกซิเจน</option><option value="other">อุปกรณ์อื่น ๆ</option></select><label>จำนวน</label><input id="q" type="number" min="1" max="20" value="1" required><label>เหตุผลสั้น ๆ (ไม่ใส่รายละเอียดโรค)</label><textarea id="r" maxlength="300" required></textarea><label>เบอร์ติดต่อ</label><input id="p" type="tel" inputmode="tel" maxlength="30" required><div class="note">การส่งคำขอยังไม่ถือว่าได้รับการยืนยันการยืม เจ้าหน้าที่ต้องตรวจอุปกรณ์ก่อนทุกครั้ง</div><button id="b">ส่งคำขอ</button><div id="m" class="msg"></div></form><a class="line" href="https://line.me/R/oaMessage/%40601cnwrw">ติดต่อเจ้าหน้าที่ผ่าน LINE</a><div class="credit">© 2026 LINE Service Hub Design &amp; Developed by Apiwat Meethong</div></main>
<script>const API='https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/linehub-public-equipment',f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='กำลังส่งคำขอ…';const body={equipment_type:document.getElementById('t').value,quantity:Number(document.getElementById('q').value),short_reason:document.getElementById('r').value.trim(),contact_phone:document.getElementById('p').value.trim()};try{const x=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await x.json();if(!x.ok)throw Error(j.detail||'ส่งคำขอไม่ได้');f.innerHTML='<div class="ok"><h2>รับคำขอแล้ว</h2><p>เจ้าหน้าที่จะตรวจสอบและติดต่อกลับ</p><b>เลขอ้างอิง: '+j.reference+'</b></div>';m.textContent=''}catch(err){m.textContent=err.message;b.disabled=false}}</script></body></html>
