<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b684f"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://txjuiaiwffsxfcrxpkvd.supabase.co; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"><title>นัดหมายของฉัน</title>
<style>:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#17342d;background:#f4faf7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf9f3,#f5f8ff,#fffaf2);min-height:100vh}main{width:min(720px,calc(100% - 20px));margin:12px auto;background:#fff;border:1px solid #dce8e3;border-radius:22px;padding:18px;box-shadow:0 10px 30px #143c3210}h1{margin:0 0 4px;font-size:24px}.muted{color:#5f746e;font-size:13px;line-height:1.5}.card{border:1px solid #dce8e3;border-radius:16px;padding:14px;margin:10px 0;background:#fbfefd}.date{font-size:19px;font-weight:800}.tag{display:inline-block;background:#e8f6ef;color:#0b684f;border-radius:999px;padding:4px 9px;font-size:12px;margin-top:6px}.note{margin-top:8px}.status{padding:12px;border-radius:12px;background:#eef8f3;margin:12px 0}.error{background:#fff0ee;color:#9d2c22}.section-title{margin-top:20px;font-size:17px}.empty{text-align:center;padding:30px 10px;color:#62746d}.credit{text-align:center;color:#71847c;font-size:11px;margin-top:18px}</style></head>
<body><main><h1>นัดหมายของฉัน</h1><div class="muted">ศูนย์บริการสาธารณสุขบ้านโทกหัวช้าง · แสดงนัดหมายที่ซิงก์จากระบบภายในไว้บน Cloud</div><div id="status" class="status">กำลังโหลดนัดหมาย…</div><section id="soon"></section><section id="later"></section><div class="credit">ข้อมูลแสดงสูงสุด 1 ปี · © 2026 LINE Service Hub Design &amp; Developed by Apiwat Meethong</div></main>
<script>
const API='https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/linehub-public-appointments',q=new URLSearchParams(location.search),token=q.get('token')||'',status=document.getElementById('status'),soon=document.getElementById('soon'),later=document.getElementById('later');
history.replaceState({},'',location.pathname);
function fmt(d){const x=new Date(d+'T00:00:00+07:00');return new Intl.DateTimeFormat('th-TH',{dateStyle:'full',timeZone:'Asia/Bangkok'}).format(x)}
function render(items,target){for(const a of items){const c=document.createElement('article');c.className='card';const d=document.createElement('div');d.className='date';d.textContent=fmt(a.appointment_date);const t=document.createElement('div');t.className='tag';t.textContent=a.service_label||'นัดหมาย';c.append(d,t);if(a.note_text){const n=document.createElement('div');n.className='note';n.textContent=a.note_text;c.append(n)}target.append(c)}}
(async()=>{if(!token){status.classList.add('error');status.textContent='ลิงก์ไม่ถูกต้อง กรุณากด “นัดหมายของฉัน” ใน LINE ใหม่';return}try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token}),cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.detail||'โหลดข้อมูลไม่ได้');const today=new Date(j.today+'T00:00:00+07:00'),cut=new Date(today);cut.setDate(cut.getDate()+30);const near=[],future=[];for(const a of j.appointments||[]){const d=new Date(a.appointment_date+'T00:00:00+07:00');(d<=cut?near:future).push(a)}status.textContent='อัปเดตข้อมูลล่าสุด '+(j.cloud_updated_at?new Date(j.cloud_updated_at).toLocaleString('th-TH',{timeZone:'Asia/Bangkok'}):'ไม่ทราบเวลา')+(j.local_online?' · ระบบข้อมูลภายในออนไลน์':' · แสดงข้อมูล Cloud ล่าสุด');if(!near.length&&!future.length){soon.innerHTML='<div class="empty">ยังไม่พบนัดหมายในช่วง 1 ปีข้างหน้า</div>';return}if(near.length){soon.innerHTML='<h2 class="section-title">ภายใน 30 วัน</h2>';render(near,soon)}if(future.length){later.innerHTML='<h2 class="section-title">นัดหมายถัดไป ภายใน 1 ปี</h2>';render(future,later)}}catch(e){status.classList.add('error');status.textContent=e.message}})();
</script></body></html>
